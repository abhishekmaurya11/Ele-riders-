<!DOCTYPE html>
<html lang="hi">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Electric Riders Registration Form</title>

  <!-- GOOGLE FONT -->

  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- HTML2CANVAS -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- JSPDF -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>

    * {

      margin: 0;
      padding: 0;

      box-sizing: border-box;

      font-family: "Noto Sans Devanagari", sans-serif;

    }

    body {

      background: #dde4eb;

      padding: 20px;

      color: #111;

    }

    /* ===================================
       PAGE
    =================================== */

    .page {

      width: 210mm;

      min-height: 297mm;

      background: white;

      margin: 20px auto;

      padding: 18mm 16mm;

      position: relative;

      border: 1px solid #d0d0d0;

      overflow: hidden;

      page-break-after: always;

    }

    /* ===================================
       TOP BAR
    =================================== */

    .top-line {

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 6px;

      background: black;

    }

    /* ===================================
       WATERMARK
    =================================== */

    .watermark {

      position: absolute;

      top: 50%;
      left: 50%;

      transform:
        translate(-50%, -50%)
        rotate(-35deg);

      font-size: 60px;

      font-weight: 800;

      color: rgba(0, 0, 0, 0.03);

      pointer-events: none;

      white-space: nowrap;

      z-index: 0;

    }

    /* ===================================
       HEADER
    =================================== */

    .header {

      text-align: center;

      margin-bottom: 28px;

      position: relative;

      z-index: 2;

    }

    .header h1 {

      font-size: 28px;

      font-weight: 800;

      margin-bottom: 8px;

    }

    .header p {

      font-size: 14px;

      color: #555;

    }

    /* ===================================
       PHOTO BOX
    =================================== */

    .photo-box {

      position: absolute;

      top: 18mm;
      right: 16mm;

      width: 135px;

      padding: 10px;

      border: 1.5px solid #000;

      border-radius: 12px;

      background: #fff;

      z-index: 5;

    }

    .photo-header {

      display: flex;

      justify-content: center;

      align-items: center;

    }

    .photo-circle {

      width: 110px;

      height: 110px;

      border: 2px solid #000;

      border-radius: 50%;

      overflow: hidden;

      background: #f5f5f5;

      display: flex;

      align-items: center;

      justify-content: center;

    }

    .photo-circle video,
    .photo-circle img {

      width: 100%;

      height: 100%;

      object-fit: cover;

      background: #000;

    }

    .photo-circle canvas {

      display: none;

    }

    .photo-circle img {

      display: none;

    }

    .capture-btn {

      width: 100%;

      margin-top: 12px;

      padding: 9px;

      border: none;

      background: #000;

      color: white;

      border-radius: 8px;

      font-size: 12px;

      font-weight: 700;

      cursor: pointer;

      transition: 0.2s;

    }

    .capture-btn:hover {

      opacity: 0.92;

    }

    /* ===================================
       SECTION TITLE
    =================================== */

    .section-title {

      margin-top: 24px;

      margin-bottom: 18px;

      border-bottom: 2px solid #000;

      padding-bottom: 6px;

      font-size: 20px;

      font-weight: 700;

      position: relative;

      z-index: 2;

    }

    /* ===================================
       INLINE FIELD
    =================================== */

    .inline-field {

      display: flex;

      align-items: center;

      gap: 10px;

      margin-bottom: 16px;

      position: relative;

      z-index: 2;

    }

    .inline-field label {

      white-space: nowrap;

      font-size: 13px;

      font-weight: 600;

    }

    .inline-field input {

      flex: 1;

      border: none;

      border-bottom: 1px dotted #666;

      padding: 6px 4px;

      outline: none;

      font-size: 13px;

      background: transparent;

    }

    /* ===================================
       MULTI FIELD
    =================================== */

    .multi-field {

      margin-bottom: 22px;

      position: relative;

      z-index: 2;

    }

    .multi-field label {

      display: block;

      font-size: 13px;

      font-weight: 700;

      margin-bottom: 8px;

    }

    .line-input {

      width: 100%;

      height: 22px;

      border: none;

      border-bottom: 1px dotted #666;

      margin-bottom: 6px;

      outline: none;

      font-size: 13px;

      background: transparent;

    }

    /* ===================================
       DOCUMENTS
    =================================== */

    .documents {

      display: grid;

      grid-template-columns: repeat(2, 1fr);

      gap: 12px;

      margin-top: 12px;

      position: relative;

      z-index: 2;

    }

    .documents label {

      display: flex;

      align-items: center;

      gap: 8px;

      font-size: 13px;

      font-weight: 600;

    }

    input[type="checkbox"] {

      width: 15px;
      height: 15px;

      accent-color: black;

    }

    /* ===================================
       DECLARATION
    =================================== */

    .declaration {

      line-height: 2;

      font-size: 13px;

      text-align: justify;

      margin-top: 15px;

      position: relative;

      z-index: 2;

    }

    /* ===================================
       SIGNATURE
    =================================== */

    .signature-box {

      margin-top: 40px;

      width: 260px;

      height: 80px;

      border: 1.5px dashed black;

      display: flex;

      align-items: end;

      justify-content: center;

      padding-bottom: 8px;

      position: relative;

      z-index: 2;

    }

    /* ===================================
       RULES
    =================================== */

    .rules-list {

      margin-left: 20px;

      margin-top: 15px;

      position: relative;

      z-index: 2;

    }

    .rules-list li {

      margin-bottom: 12px;

      font-size: 14px;

      line-height: 1.7;

    }

    /* ===================================
       FOOTER
    =================================== */

    .footer {

      position: absolute;

      bottom: 10mm;

      left: 0;

      width: 100%;

      text-align: center;

      font-size: 11px;

      color: #666;

    }

    /* ===================================
       DOWNLOAD BUTTON
    =================================== */

    .download-btn {

      display: block;

      width: 320px;

      margin: 30px auto;

      padding: 16px;

      border: none;

      background: black;

      color: white;

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;

      border-radius: 8px;

    }

    /* ===================================
       MOBILE
    =================================== */

    @media(max-width:900px){

      body {

        padding: 10px;

      }

      .page {

        width: 100%;

        min-height: auto;

        padding: 24px;

      }

      .photo-box {

        position: relative;

        top: auto;
        right: auto;

        margin: 0 auto 20px;

      }

      .documents {

        grid-template-columns: 1fr;

      }

      .inline-field {

        flex-direction: column;

        align-items: flex-start;

      }

      .inline-field input {

        width: 100%;

      }

    }

    /* ===================================
       PRINT
    =================================== */

    @media print {

      body {

        background: white;

        padding: 0;

      }

      .page {

        margin: 0;

        border: none;

      }

      .download-btn,
      .capture-btn {

        display: none;

      }

    }

  </style>

</head>

<body>

  <!-- ===================================
       PAGE 1
  =================================== -->

  <section class="page">

    <div class="top-line"></div>

    <div class="watermark">
      ELECTRIC RIDERS
    </div>

    <!-- HEADER -->

    <div class="header">

      <h1>
        इलेक्ट्रिक राइडर्स पंजीकरण फॉर्म
      </h1>

      <p>
        सी – 13 / 122, आवास विकास कॉलोनी, राजाजीपुरम, लखनऊ
      </p>

    </div>

    <!-- PHOTO -->

    <div class="photo-box">

      <div class="photo-header">

        <div class="photo-circle">

          <video id="camera" autoplay playsinline></video>

          <canvas id="canvas"></canvas>

          <img id="photoPreview">

        </div>

      </div>

      <button class="capture-btn" onclick="capturePhoto()">
        फोटो कैप्चर करें
      </button>

    </div>

    <!-- PERSONAL INFO -->

    <div class="section-title">
      व्यक्तिगत जानकारी :-
    </div>

    <div class="inline-field">

      <label>
        1. ड्राइवर का नाम :
      </label>

      <input type="text">

    </div>

    <div class="inline-field">

      <label>
        2. ड्राइवर का मोबाइल नम्बर :
      </label>

      <input type="text">

    </div>

    <div class="multi-field">

      <label>
        3. ड्राइवर का वर्तमान पता :
      </label>

      <input type="text" class="line-input">

      <input type="text" class="line-input">

      <input type="text" class="line-input">

    </div>

    <div class="multi-field">

      <label>
        4. ड्राइवर का स्थायी पता (आधार कार्ड के अनुसार) :
      </label>

      <input type="text" class="line-input">

      <input type="text" class="line-input">

      <input type="text" class="line-input">

    </div>

    <div class="inline-field">

      <label>
        5. कार्य स्थल का नाम :
      </label>

      <input type="text">

    </div>

    <div class="inline-field">

      <label>
        6. ड्राइवर की आईडी :
      </label>

      <input type="text">

    </div>

    <div class="inline-field">

      <label>
        7. ड्राइवर की माताजी का नाम एवं मोबाइल नम्बर :
      </label>

      <input type="text">

    </div>

    <div class="inline-field">

      <label>
        8. ड्राइवर की पिताजी का नाम एवं मोबाइल नम्बर :
      </label>

      <input type="text">

    </div>

    <!-- DOCUMENTS -->

    <div class="section-title">
      दस्तावेजों की सूची :-
    </div>

    <div class="documents">

      <label><input type="checkbox"> आधार कार्ड</label>

      <label><input type="checkbox"> पैन कार्ड</label>

      <label><input type="checkbox"> वोटर कार्ड</label>

      <label><input type="checkbox"> ड्राइविंग लाइसेंस</label>

      <label><input type="checkbox"> पासपोर्ट</label>

      <label><input type="checkbox"> चरित्र प्रमाण पत्र</label>

    </div>

    <div class="footer">
      Electric Riders © 2026
    </div>

  </section>

  <!-- DOWNLOAD -->

  <button class="download-btn" onclick="window.print()">
    PDF डाउनलोड करें
  </button>

  <script>

    /* CAMERA ACCESS */

    const video =
      document.getElementById("camera");

    const canvas =
      document.getElementById("canvas");

    const preview =
      document.getElementById("photoPreview");

    navigator.mediaDevices
      .getUserMedia({

        video: {
          facingMode: "user"
        }

      })

      .then((stream) => {

        video.srcObject = stream;

      })

      .catch(() => {

        alert("कैमरा एक्सेस नहीं मिला");

      });

    /* CAPTURE PHOTO */

    function capturePhoto() {

      const ctx =
        canvas.getContext("2d");

      canvas.width =
        video.videoWidth;

      canvas.height =
        video.videoHeight;

      ctx.drawImage(

        video,

        0,

        0,

        canvas.width,

        canvas.height

      );

      const image =
        canvas.toDataURL(
          "image/jpeg",
          1
        );

      preview.src = image;

      preview.style.display =
        "block";

      video.style.display =
        "none";

    }

  </script>

</body>

</html>
