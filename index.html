<!DOCTYPE html>
<html lang="hi">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>
    इलेक्ट्रिक राइडर्स पंजीकरण फॉर्म
  </title>

  <!-- GOOGLE FONT -->

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- HTML2CANVAS -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- JSPDF -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>

    :root {

      --a4-width: 210mm;
      --a4-height: 297mm;

      --black: #111;
      --gray: #666;
      --border: #cfcfcf;

    }

    * {

      margin: 0;
      padding: 0;

      box-sizing: border-box;

      font-family: "Noto Sans Devanagari", sans-serif;

    }

    body {

      background: #dde5ee;

      padding: 20px;

      color: var(--black);

    }

    #pdf-content {

      width: 100%;

    }

    /* ===================================
       PAGE
    =================================== */

    .page {

      width: var(--a4-width);

      min-height: var(--a4-height);

      background: white;

      margin: 20px auto;

      padding: 18mm 16mm;

      position: relative;

      border: 1px solid #d7d7d7;

      overflow: hidden;

      page-break-after: always;

    }

    .top-line {

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 6px;

      background: #000;

    }

    .watermark {

      position: absolute;

      top: 50%;
      left: 50%;

      transform:
        translate(-50%, -50%)
        rotate(-35deg);

      font-size: 60px;

      font-weight: 800;

      color: rgba(0,0,0,0.03);

      z-index: 0;

      pointer-events: none;

      user-select: none;

      white-space: nowrap;

    }

    .page-number {

      position: absolute;

      top: 10mm;
      right: 14mm;

      font-size: 12px;

      color: #777;

      z-index: 2;

    }

    /* ===================================
       PHOTO
    =================================== */

    .photo-wrapper {

      width: 100%;

      display: flex;

      justify-content: center;

      margin-bottom: 22px;

      position: relative;

      z-index: 5;

    }

    .photo-box {

      width: 170px;

      border: 2px solid #000;

      border-radius: 14px;

      background: #fff;

      padding: 12px;

    }

    .photo-box video,
    .photo-box img {

      width: 100%;

      height: 200px;

      object-fit: cover;

      border-radius: 10px;

      background: #f2f2f2;

    }

    #photoPreview {

      display: none;

    }

    #canvas {

      display: none;

    }

    .capture-btn {

      width: 100%;

      margin-top: 10px;

      padding: 11px;

      border: none;

      background: #000;

      color: white;

      border-radius: 8px;

      font-size: 14px;

      font-weight: 700;

      cursor: pointer;

    }

    /* ===================================
       HEADER
    =================================== */

    .header {

      text-align: center;

      margin-bottom: 30px;

      position: relative;

      z-index: 2;

    }

    .header h1 {

      font-size: 30px;

      font-weight: 800;

      margin-bottom: 8px;

    }

    .header p {

      font-size: 14px;

      color: #444;

    }

    /* ===================================
       SECTION TITLE
    =================================== */

    .section-title {

      font-size: 22px;

      font-weight: 700;

      margin-top: 26px;

      margin-bottom: 18px;

      border-bottom: 2px solid #000;

      padding-bottom: 6px;

      position: relative;

      z-index: 2;

    }

    /* ===================================
       FIELD
    =================================== */

    .field-inline {

      display: flex;

      align-items: flex-start;

      gap: 14px;

      margin-bottom: 18px;

      position: relative;

      z-index: 2;

    }

    .field-inline label {

      width: 280px;

      font-size: 14px;

      font-weight: 600;

      line-height: 1.8;

      flex-shrink: 0;

    }

    .triple-line {

      flex: 1;

      display: flex;

      flex-direction: column;

      gap: 10px;

    }

    .triple-line input {

      width: 100%;

      border: none;

      border-bottom: 1px dotted #666;

      padding: 6px 2px;

      font-size: 13px;

      background: transparent;

      outline: none;

    }

    input:focus {

      border-bottom: 1px solid #000;

    }

    /* ===================================
       DOCUMENTS
    =================================== */

    .documents-grid {

      display: grid;

      grid-template-columns: repeat(2, 1fr);

      gap: 14px;

      margin-top: 15px;

      position: relative;

      z-index: 2;

    }

    .documents-grid label {

      display: flex;

      align-items: center;

      gap: 10px;

      font-size: 14px;

    }

    input[type="checkbox"] {

      width: 16px;
      height: 16px;

      accent-color: black;

    }

    /* ===================================
       DECLARATION
    =================================== */

    .declaration {

      line-height: 2;

      text-align: justify;

      font-size: 14px;

      margin-top: 15px;

      position: relative;

      z-index: 2;

    }

    /* ===================================
       SIGNATURE
    =================================== */

    .signature-line {

      margin-top: 40px;

      display: flex;

      align-items: center;

      gap: 18px;

      position: relative;

      z-index: 2;

    }

    .signature-line span {

      font-size: 15px;

      font-weight: 700;

    }

    .signature-line .line {

      flex: 1;

      border-bottom: 1px dashed #000;

      height: 1px;

    }

    /* ===================================
       LIST
    =================================== */

    .info-list {

      margin-left: 22px;

      margin-top: 12px;

      position: relative;

      z-index: 2;

    }

    .info-list li {

      margin-bottom: 18px;

      line-height: 1.8;

      font-size: 14px;

    }

    .info-list input {

      width: 240px;

      border: none;

      border-bottom: 1px dotted #666;

      margin-left: 8px;

      padding: 4px;

      background: transparent;

      outline: none;

    }

    /* ===================================
       RULES
    =================================== */

    .rules-section {

      margin-bottom: 30px;

      position: relative;

      z-index: 2;

    }

    .rules-section h3 {

      font-size: 20px;

      margin-bottom: 16px;

      font-weight: 700;

    }

    .rules-section ul {

      margin-left: 24px;

      line-height: 2;

    }

    .rules-section li {

      margin-bottom: 12px;

      font-size: 14px;

    }

    /* ===================================
       MAIN HEADING
    =================================== */

    .main-heading {

      text-align: center;

      font-size: 30px;

      font-weight: 800;

      margin-bottom: 35px;

      text-decoration: underline;

      position: relative;

      z-index: 2;

    }

    /* ===================================
       FOOTER
    =================================== */

    .footer {

      position: absolute;

      bottom: 10mm;

      left: 0;

      width: 100%;

      text-align: center;

      font-size: 11px;

      color: #666;

    }

    /* ===================================
       BUTTON
    =================================== */

    .download-btn {

      display: block;

      width: 320px;

      margin: 30px auto;

      padding: 16px;

      border: none;

      background: #000;

      color: #fff;

      border-radius: 8px;

      font-size: 17px;

      font-weight: 700;

      cursor: pointer;

    }

    /* ===================================
       MOBILE
    =================================== */

    @media(max-width:900px){

      body {

        padding: 10px;

      }

      .page {

        width: 100%;

        min-height: auto;

        padding: 24px;

      }

      .field-inline {

        flex-direction: column;

      }

      .field-inline label {

        width: 100%;

      }

      .documents-grid {

        grid-template-columns: 1fr;

      }

      .info-list input {

        width: 100%;

        display: block;

        margin-left: 0;

        margin-top: 8px;

      }

    }

    /* ===================================
       PRINT
    =================================== */

    @media print {

      body {

        background: white;

        padding: 0;

      }

      .page {

        margin: 0;

        border: none;

      }

      .download-btn,
      .capture-btn {

        display: none;

      }

    }

  </style>

</head>

<body>

<div id="pdf-content">

  <!-- ===================================
       PAGE 1
  =================================== -->

  <section class="page">

    <div class="top-line"></div>

    <div class="watermark">
      ELECTRIC RIDERS
    </div>

    <div class="page-number">
      1 | Page
    </div>

    <!-- PHOTO -->

    <div class="photo-wrapper">

      <div class="photo-box">

        <video id="camera" autoplay playsinline></video>

        <canvas id="canvas"></canvas>

        <img id="photoPreview">

        <button class="capture-btn" onclick="capturePhoto()">
          फोटो कैप्चर करें
        </button>

      </div>

    </div>

    <!-- HEADER -->

    <div class="header">

      <h1>
        इलेक्ट्रिक राइडर्स पंजीकरण फॉर्म
      </h1>

      <p>
        सी – 13 / 122, आवास विकास कॉलोनी, राजाजीपुरम, लखनऊ
      </p>

    </div>

    <!-- PERSONAL INFO -->

    <div class="section-title">
      व्यक्तिगत जानकारी :-
    </div>

    <div class="field-inline">

      <label>1. ड्राइवर का नाम :</label>

      <div class="triple-line">

        <input type="text">
        <input type="text">
        <input type="text">

      </div>

    </div>

    <div class="field-inline">

      <label>2. ड्राइवर का मोबाइल नम्बर :</label>

      <div class="triple-line">

        <input type="text">
        <input type="text">
        <input type="text">

      </div>

    </div>

    <div class="field-inline">

      <label>3. ड्राइवर का वर्तमान पता :</label>

      <div class="triple-line">

        <input type="text">
        <input type="text">
        <input type="text">

      </div>

    </div>

    <div class="field-inline">

      <label>
        4. ड्राइवर का स्थायी पता
        (आधार कार्ड के अनुसार) :
      </label>

      <div class="triple-line">

        <input type="text">
        <input type="text">
        <input type="text">

      </div>

    </div>

    <div class="field-inline">

      <label>5. कार्य स्थल का नाम :</label>

      <div class="triple-line">

        <input type="text">
        <input type="text">
        <input type="text">

      </div>

    </div>

    <div class="field-inline">

      <label>6. ड्राइवर की आईडी :</label>

      <div class="triple-line">

        <input type="text">
        <input type="text">
        <input type="text">

      </div>

    </div>

    <div class="field-inline">

      <label>
        7. ड्राइवर की माताजी का नाम एवं मो नं :
      </label>

      <div class="triple-line">

        <input type="text">
        <input type="text">
        <input type="text">

      </div>

    </div>

    <div class="field-inline">

      <label>
        8. ड्राइवर की पिताजी का नाम एवं मो नं :
      </label>

      <div class="triple-line">

        <input type="text">
        <input type="text">
        <input type="text">

      </div>

    </div>

    <!-- DOCUMENTS -->

    <div class="section-title">
      दस्तावेजों की सूची :-
    </div>

    <div class="documents-grid">

      <label><input type="checkbox"> A. आधार कार्ड</label>

      <label><input type="checkbox"> B. पैन कार्ड</label>

      <label><input type="checkbox"> C. वोटर कार्ड</label>

      <label><input type="checkbox"> D. ड्राइविंग लाइसेंस</label>

      <label><input type="checkbox"> E. पासपोर्ट</label>

      <label><input type="checkbox"> F. चरित्र प्रमाण पत्र</label>

    </div>

    <!-- GUARANTOR -->

    <div class="section-title">
      गारन्टर की जानकारी :-
    </div>

    <div class="field-inline">

      <label>1. गारन्टर का नाम :</label>

      <div class="triple-line">

        <input type="text">
        <input type="text">
        <input type="text">

      </div>

    </div>

  </section>

</div>

<button class="download-btn" onclick="downloadPDF()">
  PDF डाउनलोड करें
</button>

<script>

const video =
  document.getElementById("camera");

const canvas =
  document.getElementById("canvas");

const preview =
  document.getElementById("photoPreview");

/* CAMERA */

async function startCamera() {

  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: "user",
          width: {
            ideal: 1280
          },
          height: {
            ideal: 720
          }
        },

        audio: false

      });

    video.srcObject = stream;

  }

  catch (error) {

    alert("कैमरा एक्सेस नहीं मिला");

  }

}

startCamera();

/* PHOTO */

function capturePhoto() {

  const context =
    canvas.getContext("2d");

  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;

  context.drawImage(

    video,

    0,

    0,

    canvas.width,

    canvas.height

  );

  const imageData =
    canvas.toDataURL(
      "image/jpeg",
      1
    );

  preview.src =
    imageData;

  preview.style.display =
    "block";

  video.style.display =
    "none";

}

/* PDF */

async function downloadPDF() {

  const button =
    document.querySelector(".download-btn");

  button.innerHTML =
    "PDF तैयार हो रही है...";

  button.disabled = true;

  const {
    jsPDF
  } = window.jspdf;

  const pdf =
    new jsPDF({

      orientation: "portrait",

      unit: "mm",

      format: "a4",

      compress: true

    });

  const pages =
    document.querySelectorAll(".page");

  for (let i = 0; i < pages.length; i++) {

    const page =
      pages[i];

    const canvas =
      await html2canvas(page, {

        scale: 3,

        useCORS: true,

        backgroundColor: "#ffffff",

        logging: false,

        scrollX: 0,

        scrollY: 0

      });

    const image =
      canvas.toDataURL(
        "image/jpeg",
        1.0
      );

    if (i > 0) {

      pdf.addPage();

    }

    pdf.addImage(

      image,

      "JPEG",

      0,

      0,

      210,

      297,

      "",

      "FAST"

    );

  }

  pdf.save(
    "Electric-Riders-Registration-Form.pdf"
  );

  button.innerHTML =
    "PDF डाउनलोड करें";

  button.disabled =
    false;

}

</script>

</body>
</html>
